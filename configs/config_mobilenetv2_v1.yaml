# ──────────────────────────────────────────────
# MobileNetV2 — v1
# L2=0.0001, dropout=0.5, fine_tune_lr=2e-05 — weak L2, moderate dropout
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    mobilenetv2
num_classes: 23
img_size:    [224, 224]

# --- Training ---
batch_size: 256
epochs:     100
patience:   15

# Phase 1: train head only (backbone frozen)
learning_rate: 0.004
# Phase 2: unfreeze all backbone layers
fine_tune_epochs:          50
fine_tune_lr:              0.00002
fine_tune_unfrozen_layers: "all"

# --- Class weights ---
compute_class_weight: true

# --- Augmentation ---
augment: true
rotation_range:  0.1
zoom_range:      0.1
contrast_range:  0.1

# --- Head architecture ---
hidden_layer_sizes: [512]
dropout_rate: 0.5
l2_regularization: 0.0001

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score
  - accuracy

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/mobilenetv2
log_dir:        outputs/logs/mobilenetv2
