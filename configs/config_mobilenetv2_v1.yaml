# ──────────────────────────────────────────────
# MobileNetV2 — v1
# Small batch size with low dropout — tests whether noisier gradient
# updates from smaller batches improve generalisation.
# batch=64, lr=0.001, dropout=0.2, head=[256], unfrozen=30
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    mobilenetv2
num_classes: 23
img_size:    [224, 224]   # MobileNetV2 native input size

# --- Training ---
batch_size: 64
epochs:     100
patience:   12

# Phase 1: train head only (backbone frozen)
learning_rate: 0.001   # scaled with batch_size (64 → base lr)
# Phase 2: fine-tune top backbone layers at lower lr
fine_tune_epochs:          40
fine_tune_lr:              0.00001
fine_tune_unfrozen_layers: 30   # last N layers of backbone

# --- Class weights ---
compute_class_weight: true   # handles class imbalance in WikiArt

# --- Augmentation ---
augment: true
rotation_range:  0.1   # ±10% rotation
zoom_range:      0.1   # ±10% zoom
contrast_range:  0.1   # ±10% contrast

# --- Head architecture ---
hidden_layer_sizes: [256]
dropout_rate: 0.2   # low dropout — model regularised mainly via augmentation

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score
  - accuracy

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/mobilenetv2_v1
log_dir:        outputs/logs/mobilenetv2_v1
