# ──────────────────────────────────────────────
# MobileNetV3Large — Transfer Learning (Tier 3)
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    mobilenetv3
num_classes: 23
img_size:    [224, 224]   # MobileNetV3 native input size

# --- Training ---
batch_size: 64
epochs:     100
patience:   7

# Phase 1: train head only (backbone frozen)
learning_rate: 0.001
# Phase 2: fine-tune backbone at lower lr
fine_tune_epochs:          15
fine_tune_lr:              0.00001
fine_tune_unfrozen_layers: 10      # last N layers — avoids catastrophic forgetting

# --- Class weights ---
compute_class_weight: true   # balance loss for imbalanced artist counts

# --- Augmentation --- (disabled for baseline comparison)
augment: false
# rotation_range:  0.1
# zoom_range:      0.1
# contrast_range:  0.1

# --- Head architecture ---
hidden_layer_sizes: [256]   # bottleneck between 960-dim backbone output and 23 classes
dropout_rate: 0.4

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score
  - accuracy

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/mobilenetv3
log_dir:        outputs/logs/mobilenetv3
