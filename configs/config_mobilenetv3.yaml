# ──────────────────────────────────────────────
# MobileNetV3Large — Transfer Learning (Tier 3)
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    mobilenetv3
num_classes: 23
img_size:    [512, 512]

# --- Training ---
batch_size: 32
epochs:     30
patience:   5

fine_tune_epochs:    10
fine_tune_lr:        0.00001
num_unfreeze_layers: 10      # layers to unfreeze in Phase 2 (-1 = all, N = last N layers)

# --- Augmentation ---
augment: false                 # Enable data augmentation
# rotation_range:  0.1
# zoom_range:      0.1
# contrast_range:  0.1

# --- Class Weight Balancing ---
compute_class_weight: false    # Auto-compute balanced class weights

# --- Compile ---
optimizer:     adam
learning_rate: 0.001
loss:          sparse_categorical_crossentropy
metrics:
  - f1_score

# --- Head Architecture ---
pooling_type:        global_average_pooling2d
hidden_layer_sizes:  [512,256]
dropout_rate:        0.4
batch_norm:          true

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/mobilenetv3
log_dir:        outputs/logs/mobilenetv3
