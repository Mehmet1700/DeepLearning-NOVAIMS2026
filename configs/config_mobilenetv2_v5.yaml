# ──────────────────────────────────────────────
# MobileNetV2 — v5
# Compare dropout 0.4 vs 0.5 — identical to v1 except dropout is lower.
# Determines whether 0.5 is optimal or slightly over-regularised.
# batch=256, lr=0.004, fine_tune_lr=8e-05, unfrozen=80, dropout=0.4
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    mobilenetv2
num_classes: 23
img_size:    [224, 224]

# --- Training ---
batch_size: 256
epochs:     100
patience:   12

# Phase 1: train head only (backbone frozen)
learning_rate: 0.004
# Phase 2: fine-tune top backbone layers at lower lr
fine_tune_epochs:          40
fine_tune_lr:              0.00008
fine_tune_unfrozen_layers: 80

# --- Class weights ---
compute_class_weight: true

# --- Augmentation ---
augment: true
rotation_range:  0.1
zoom_range:      0.1
contrast_range:  0.1

# --- Head architecture ---
hidden_layer_sizes: [512]
dropout_rate: 0.4   # compare against v1 (dropout=0.5) to find optimal

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score
  - accuracy

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/mobilenetv2_v5
log_dir:        outputs/logs/mobilenetv2_v5
