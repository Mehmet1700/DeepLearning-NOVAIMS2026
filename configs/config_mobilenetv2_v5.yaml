# ──────────────────────────────────────────────
# MobileNetV2 — v5
# Deep two-layer head with very deep backbone fine-tuning and gentle augmentation.
# batch=128, lr=0.002, dropout=0.3, head=[512, 256], unfrozen=80, aug=0.05
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    mobilenetv2
num_classes: 23
img_size:    [224, 224]   # MobileNetV2 native input size

# --- Training ---
batch_size: 128
epochs:     100
patience:   15   # longer patience for deep fine-tuning convergence

# Phase 1: train head only (backbone frozen)
learning_rate: 0.002   # scaled with batch_size (128 → 2× base lr)
# Phase 2: fine-tune top backbone layers at lower lr
fine_tune_epochs:          50   # more epochs for deep backbone adaptation
fine_tune_lr:              0.00002
fine_tune_unfrozen_layers: 80   # last N layers — deep backbone fine-tuning

# --- Class weights ---
compute_class_weight: true   # handles class imbalance in WikiArt

# --- Augmentation ---
augment: true
rotation_range:  0.05   # ±5% — gentle augmentation, backbone does more heavy lifting
zoom_range:      0.05
contrast_range:  0.05

# --- Head architecture ---
hidden_layer_sizes: [512, 256]   # two-layer head for richer feature transformation
dropout_rate: 0.3

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score
  - accuracy

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/mobilenetv2_v5
log_dir:        outputs/logs/mobilenetv2_v5
