# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone: vit
num_classes: 23
img_size: [224, 224]

# --- ViT specific ---
patch_size: 16
projection_dim: 64
num_heads: 4
transformer_layers: 6
mlp_dim: 128

# --- Training ---
batch_size: 32
epochs: 80
patience: 5
learning_rate: 0.001

# --- Compile ---
optimizer: adam
loss: sparse_categorical_crossentropy
metrics:
  - f1_score

# --- Augmentation --- (disabled for baseline comparison)
augment: True
rotation_range: 0.1
zoom_range: 0.1
contrast_range: 0.1

# --- Output ---
checkpoint_dir: outputs/checkpoints/vit
log_dir: outputs/logs/vit