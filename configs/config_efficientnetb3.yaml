# ──────────────────────────────────────────────
# EfficientNetB3 — Transfer Learning (Tier 2)
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    efficientnetb3
num_classes: 23
img_size:    [300, 300]   # EfficientNetB3 native input size

# --- Training ---
batch_size: 64
epochs:     30
patience:   6

# Phase 1: train head only (backbone frozen)
learning_rate: 0.001
# Phase 2: fine-tune backbone at lower lr
fine_tune_epochs:          20
fine_tune_lr:              0.00001
fine_tune_unfrozen_layers: 100     # "all" or last N layers

# --- Augmentation --- (disabled for baseline comparison)
augment: True
rotation_range:  0.2
zoom_range:      0.2
contrast_range:  0.2

# --- CLASSIFICATION HEAD ARCHITECTURE ---
pooling_type: flatten
hidden_layer_sizes: []
dropout_rate: 0.4
batch_norm: True

compute_class_weight: True 

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/efficientnetb3
log_dir:        outputs/logs/efficientnetb3
