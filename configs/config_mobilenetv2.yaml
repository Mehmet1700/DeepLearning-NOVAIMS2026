# ──────────────────────────────────────────────
# MobileNetV2 — Transfer Learning
# ──────────────────────────────────────────────
# MobileNetV2 uses inverted residuals + linear bottlenecks.
# Produces 1280-dim feature vectors (vs 960 for MobileNetV3Large).
# No include_preprocessing quirk — standard preprocessing pipeline.

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    mobilenetv2
num_classes: 23
img_size:    [224, 224]   # MobileNetV2 native input size

# --- Training ---
batch_size: 256
epochs:     100
patience:   10

# Phase 1: train head only (backbone frozen)
learning_rate: 0.004
# Phase 2: fine-tune backbone at lower lr
fine_tune_epochs:          40
fine_tune_lr:              0.00004
fine_tune_unfrozen_layers: 30      # last N layers — avoids catastrophic forgetting

# --- Class weights ---
compute_class_weight: true

# --- Augmentation ---
augment: true
rotation_range:  0.1
zoom_range:      0.1
contrast_range:  0.1

# --- Head architecture ---
hidden_layer_sizes: [256]
dropout_rate: 0.4

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score
  - accuracy

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/mobilenetv2
log_dir:        outputs/logs/mobilenetv2
