# ──────────────────────────────────────────────
# ViT-Base/16 Pretrained — v1
# Backbone: TF Hub (sayakpaul/vit_b16_fe/1, ImageNet21k)
# TF 2.15 compatible — no keras_hub required
#
# BEFORE FIRST HPC JOB — download weights on the login node:
#   export TFHUB_CACHE_DIR=$(pwd)/.tfhub_cache
#   python -c "import tensorflow_hub as hub; hub.load('https://tfhub.dev/sayakpaul/vit_b16_fe/1')"
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    vit_tfhub
vit_hub_url: https://tfhub.dev/sayakpaul/vit_b16_fe/1
num_classes: 23
img_size:    [224, 224]

# --- Training ---
batch_size: 32
epochs:     50
patience:   10

# Phase 1: train classification head only (backbone frozen)
learning_rate: 0.001

# Phase 2: full fine-tune at low LR
fine_tune_epochs:          20
fine_tune_lr:              0.00001
fine_tune_unfrozen_layers: all

# --- Head ---
dropout_rate: 0.1

# --- Class weights ---
compute_class_weight: true

# --- Augmentation ---
augment: true
rotation_range:  0.1
zoom_range:      0.1
contrast_range:  0.1

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score
  - accuracy

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/vit_tfhub
log_dir:        outputs/logs/vit_tfhub
