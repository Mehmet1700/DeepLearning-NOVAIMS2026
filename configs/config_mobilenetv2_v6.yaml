# ──────────────────────────────────────────────
# MobileNetV2 — v6
# Higher fine_tune_lr (1e-04) with best settings — tests whether more
# aggressive backbone updates push val_f1 beyond 0.76.
# batch=256, lr=0.004, fine_tune_lr=1e-04, unfrozen=60, dropout=0.5
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    mobilenetv2
num_classes: 23
img_size:    [224, 224]

# --- Training ---
batch_size: 256
epochs:     100
patience:   12

# Phase 1: train head only (backbone frozen)
learning_rate: 0.004
# Phase 2: fine-tune top backbone layers at higher lr
fine_tune_epochs:          40
fine_tune_lr:              0.0001   # higher than previous best (8e-05) — tests limit
fine_tune_unfrozen_layers: 60

# --- Class weights ---
compute_class_weight: true

# --- Augmentation ---
augment: true
rotation_range:  0.1
zoom_range:      0.1
contrast_range:  0.1

# --- Head architecture ---
hidden_layer_sizes: [512]
dropout_rate: 0.5

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score
  - accuracy

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/mobilenetv2
log_dir:        outputs/logs/mobilenetv2
