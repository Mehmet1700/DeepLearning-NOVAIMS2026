# ──────────────────────────────────────────────
# MobileNetV2 — v4
# Large head with aggressive fine-tuning and high dropout — tests maximum
# backbone adaptation while keeping head regularised.
# batch=256, lr=0.004, dropout=0.5, head=[512], unfrozen=60, fine_tune_lr=6e-05
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    mobilenetv2
num_classes: 23
img_size:    [224, 224]   # MobileNetV2 native input size

# --- Training ---
batch_size: 256
epochs:     100
patience:   15   # longer patience to allow convergence under heavy regularisation

# Phase 1: train head only (backbone frozen)
learning_rate: 0.004   # scaled with batch_size (256 → 4× base lr)
# Phase 2: fine-tune top backbone layers at lower lr
fine_tune_epochs:          40
fine_tune_lr:              0.00006
fine_tune_unfrozen_layers: 60   # last N layers of backbone

# --- Class weights ---
compute_class_weight: true   # handles class imbalance in WikiArt

# --- Augmentation ---
augment: true
rotation_range:  0.1   # ±10% rotation
zoom_range:      0.1   # ±10% zoom
contrast_range:  0.1   # ±10% contrast

# --- Head architecture ---
hidden_layer_sizes: [512]   # larger head capacity
dropout_rate: 0.5   # high dropout to compensate for larger head

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score
  - accuracy

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/mobilenetv2_v4
log_dir:        outputs/logs/mobilenetv2_v4
