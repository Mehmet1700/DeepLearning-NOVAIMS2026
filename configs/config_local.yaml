# ──────────────────────────────────────────────
# Local development configuration
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    baseline
num_classes: 23
img_size:    [128, 128]

# --- Training ---
batch_size: 128
epochs:     5
patience:   5

# Phase 2 disabled for local testing
fine_tune_epochs: 0
fine_tune_lr:     0.00001
fine_tune_unfrozen_layers: all

# --- Augmentation ---
augment: false

# --- Compile ---
optimizer:     adam
learning_rate: 0.001
loss:          sparse_categorical_crossentropy
metrics:
  - f1_score

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/local
log_dir:        outputs/logs/local
