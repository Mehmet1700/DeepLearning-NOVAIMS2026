# ──────────────────────────────────────────────
# MobileNetV2 — v2
# Two-layer classification head — tests whether an additional dense layer
# better bridges the 1280-dim backbone features to 23 classes.
# batch=128, lr=0.002, dropout=0.3, head=[512, 256], unfrozen=40
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    mobilenetv2
num_classes: 23
img_size:    [224, 224]   # MobileNetV2 native input size

# --- Training ---
batch_size: 128
epochs:     100
patience:   12

# Phase 1: train head only (backbone frozen)
learning_rate: 0.002   # scaled with batch_size (128 → 2× base lr)
# Phase 2: fine-tune top backbone layers at lower lr
fine_tune_epochs:          40
fine_tune_lr:              0.00002
fine_tune_unfrozen_layers: 40   # last N layers of backbone

# --- Class weights ---
compute_class_weight: true   # handles class imbalance in WikiArt

# --- Augmentation ---
augment: true
rotation_range:  0.1   # ±10% rotation
zoom_range:      0.1   # ±10% zoom
contrast_range:  0.1   # ±10% contrast

# --- Head architecture ---
hidden_layer_sizes: [512, 256]   # two-layer head for richer feature transformation
dropout_rate: 0.3

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score
  - accuracy

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/mobilenetv2_v2
log_dir:        outputs/logs/mobilenetv2_v2
