# ──────────────────────────────────────────────
# MobileNetV2 — v3
# Unfreeze ALL backbone layers — maximum adaptation to WikiArt domain.
# Very low fine_tune_lr (2e-05) to prevent catastrophic forgetting of
# ImageNet features. Longer fine-tune phase to allow gradual adjustment.
# batch=256, lr=0.004, fine_tune_lr=2e-05, unfrozen=all, dropout=0.5
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    mobilenetv2
num_classes: 23
img_size:    [224, 224]

# --- Training ---
batch_size: 256
epochs:     100
patience:   15

# Phase 1: train head only (backbone frozen)
learning_rate: 0.004
# Phase 2: unfreeze entire backbone at very low lr
fine_tune_epochs:          50
fine_tune_lr:              0.00002   # very low to avoid catastrophic forgetting
fine_tune_unfrozen_layers: "all"     # unfreeze all backbone layers

# --- Class weights ---
compute_class_weight: true

# --- Augmentation ---
augment: true
rotation_range:  0.1
zoom_range:      0.1
contrast_range:  0.1

# --- Head architecture ---
hidden_layer_sizes: [512]
dropout_rate: 0.5

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score
  - accuracy

# --- Output paths ---
checkpoint_dir: outputs/checkpoints/mobilenetv2
log_dir:        outputs/logs/mobilenetv2
