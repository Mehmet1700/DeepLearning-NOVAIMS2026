# ──────────────────────────────────────────────
# VGG16 — Transfer Learning (Tier 2)
# ──────────────────────────────────────────────

# --- Data ---
train_dir: data/train
val_dir:   data/validation
test_dir:  data/test

# --- Model ---
backbone:    vgg16
num_classes: 23
img_size:    [224, 224]   # VGG16 native input size

# --- Training ---
batch_size: 32
epochs:     30
patience:   6

# Phase 1: train head only (backbone frozen)
learning_rate: 0.001
# Phase 2: fine-tune backbone at lower lr
fine_tune_epochs:          20
fine_tune_lr:              0.00001
fine_tune_unfrozen_layers: 10     # "all" or last N layers

# --- Augmentation --- (disabled for baseline comparison)
augment: True
rotation_range:  0.05
zoom_range:      0.05
contrast_range:  0.05

# --- Compile ---
optimizer: adam
loss:      sparse_categorical_crossentropy
metrics:
  - f1_score

# --- CLASSIFICATION HEAD ARCHITECTURE ---
pooling_type: global_average_pooling2d
hidden_layer_sizes: [1024, 512, 512, 256]
dropout_rate: 0.2
batch_norm: True

# --- CLASS WEIGHT BALANCING (Optional) ---
compute_class_weight: True 

#--- Output paths ---
checkpoint_dir: outputs/checkpoints/vgg16
log_dir:        outputs/logs/vgg16

